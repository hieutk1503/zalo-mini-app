version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: tu-lan-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tu_lan_smart
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis/redis-stack:latest
    container_name: tu-lan-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
